[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-lite"
version = "0.1.0"
description = "Quantum Bias Lab: laptop-runnable bias lab on a local simulator or a real IBM QPU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Superlinear" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "qiskit==1.4.5",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.44.1",
    "fastapi",
    "uvicorn",
    "numpy",
    "python-dotenv",
]

[project.scripts]
quantum-lite = "quantum_lite.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette 1.7 warns when TestClient runs on httpx; httpx is the pinned dev
    # dependency. Ignored by exact message, nothing broader.
    # qiskit-aer 0.17.2 reads Instruction.condition (deprecated in qiskit 1.3) inside its own
    # worker thread when it assembles any circuit under the pinned qiskit 1.4.5. Third-party,
    # pinned here, no behavioural effect; ignored by exact message.
    "ignore:The property ``qiskit.circuit.instruction.Instruction.condition`` is deprecated as of qiskit 1.3.0:DeprecationWarning",
    # qiskit-ibm-runtime 0.44.1 reads circuit.calibrations in its ISA pre-submit check
    # (utils.validate_isa_circuits) under the pinned qiskit 1.4.5, where the property is deprecated.
    # Third-party, no behavioural effect; ignored by message prefix, category DeprecationWarning.
    "ignore:The property ``qiskit.circuit.quantumcircuit.QuantumCircuit.calibrations`` is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]
